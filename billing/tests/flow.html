<!doctype html><html><head><meta charset="utf-8"><title>flow</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/app.css"></head><body>
<div class="app"><aside id="sidebar" class="sidebar"></aside><main id="main" class="main"></main></div><div id="toasts" class="toast-stack"></div><pre id="out">running…</pre>
<script src="../js/core.js"></script><script src="../js/logic.js"></script><script src="../js/advances.js"></script><script src="../js/seed.js"></script><script src="../js/ui.js"></script>
<script src="../js/screens-po.js"></script><script src="../js/screens-receipts.js"></script><script src="../js/screens-bill.js"></script><script src="../js/screens-inv.js"></script><script src="../js/screens-adv.js"></script><script src="../js/screens-dash.js"></script>
<script>
/* Drives the app the way a user does: clicks real buttons and types into real inputs inside the drawers. */
const log = [], flush = () => { document.getElementById('out').textContent = log.join('\n'); };
const T = (n, ok, extra) => { log.push((ok ? 'PASS ' : 'FAIL ') + n + (ok ? '' : ' :: ' + (extra || ''))); flush(); };
window.addEventListener('error', e => { log.push('ERR ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); flush(); });
try { localStorage.clear(); } catch (e) {}
const PO = id => db.pos.find(p => p.id === id);
const nav = h => { location.hash = '#/' + h; render(); };
const $q = s => document.querySelector(s);
const click = sel => { const el = $q(sel); if (!el) throw new Error('no element ' + sel); el.click(); return el; };
const setv = (path, v) => { const el = $q(`.panel [data-f="${path}"]`); if (!el) throw new Error('no field ' + path); if (el.type === 'checkbox') el.checked = v; else el.value = v; el.dispatchEvent(new Event(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', { bubbles: true })); };
const submitModal = () => { const f = $q('.overlay form'); if (!f) return false; f.requestSubmit(); return true; };
const modalText = () => $q('.overlay')?.textContent || '';
const panelText = () => $q('.panel')?.textContent || '';
const mainText = () => document.getElementById('main').textContent;
const msModal = (act, i, vals) => { click(`.panel [data-act="${act}"]` + (i != null ? `[data-i="${i}"]` : '')); const f = $q('.overlay form'); Object.entries(vals).forEach(([k, v]) => { const el = f.querySelector(`[name=${k}]`); if (el.type === 'checkbox') { el.checked = v; el.dispatchEvent(new Event('change', { bubbles: true })); } else el.value = v; }); submitModal(); };
const run = (name, fn) => { try { fn(); } catch (e) { T(name + ' threw', false, e.message + ' @ ' + (e.stack || '').split('\n')[1]); } };

const sample = () => click('.panel [data-act="add-sample"]');
const msRow = id => `#main [data-act="ms-approve"][data-id="${id}"]`;
const addInvLine = id => { click('.panel [data-act="inv-line-add"]'); const cb = $q(`.overlay input[data-pick="${id}"]`); if (!cb) { document.querySelector('.overlay')?.remove(); return false; } cb.click(); submitModal(); return true; };

/* ===== 1. ACCEPTANCE TEST: certificate-only milestone (10,000) on a goods PO — invoiceable on approval, no GRN invented ===== */
run('document-only milestone', () => {
  seedDb('default'); nav('po/po-1045?tab=billing'); const po = PO('po-1045'), c = msOf(po)[1], grns0 = db.grns.filter(g => g.poId === po.id).length;
  T('milestone is a 10,000 certificate with no GRN / SRN required', c.amount === 10000 && c.needsDoc && !c.needsGrn && !c.needsSrn && c.status === 'Submitted for Approval');
  T('not invoiceable before approval', msBilling(c, po) === 'Not Eligible' && msEnt(c, po) === 0);
  T('row offers Approve', !!$q(msRow(c.id))); click(msRow(c.id)); submitModal();
  T('approved by the approver', getMS(c.id).status === 'Approved' && getMS(c.id).doc.status === 'Approved');
  T('10,000 becomes invoiceable on certificate approval alone', msBilling(getMS(c.id), po) === 'Eligible' && msEnt(getMS(c.id), po) === 10000);
  T('no GRN was fabricated', db.grns.filter(g => g.poId === po.id).length === grns0);
  T('row now offers Invoice', !!$q(`#main [data-act="inv-new"][data-ms="${c.id}"]`)); click(`#main [data-act="inv-new"][data-ms="${c.id}"]`);
  T('invoice drawer opens with the milestone preselected at 10,000', ui.f.alloc['milestone:' + c.id]?.on === true && ui.f.alloc['milestone:' + c.id].value === 10000);
  setv('number', 'CERT-1'); click('[data-act="inv-save"][data-m="submit"]');
  T('invoice created for 10,000', db.invoices.some(i => i.number === 'CERT-1' && i.status === 'Pending Approval' && i.net === 10000));
  closePanel(); openInvPanel({ poId: po.id }); T('billed milestone is not offered again (no duplicate invoicing)', addInvLine('milestone:' + c.id) === false); closePanel();
  T('a second invoice is refused by the engine', !A.saveInvoice({ poId: po.id, number: 'CERT-2', date: todayISO(), attachments: [], allocs: [{ kind: 'milestone', refId: c.id, qty: null, value: 10000 }], net: 0, autoMatch: true }, 'submit').ok);
});

/* ===== 2. Full lifecycle through the UI: Pending → In Progress → Submitted → Under Review → Rejected → resubmit → Approved ===== */
run('milestone lifecycle', () => {
  seedDb('default'); nav('po/po-1043?tab=billing'); const po = PO('po-1043'), m = msOf(po)[2];
  T('M3 starts Pending with a Start button', m.status === 'Pending' && !!$q(`#main [data-act="ms-start"][data-id="${m.id}"]`)); click(`#main [data-act="ms-start"][data-id="${m.id}"]`); T('In Progress', getMS(m.id).status === 'In Progress');
  openMilestonePanel(m.id); click('.panel .panel-foot [data-act="ms-submit"]'); T('submit without the mandatory certificate is refused', getMS(m.id).status === 'In Progress');
  sample(); click('.panel .panel-foot [data-act="ms-submit"]'); T('Submitted for Approval with evidence', getMS(m.id).status === 'Submitted for Approval' && docState(getMS(m.id)) === 'Pending Approval');
  click('.panel [data-act="ms-review"]'); T('Under Review', getMS(m.id).status === 'Under Review');
  click('.panel .card [data-act="ms-reject"]'); $q('.overlay textarea').value = 'Signature missing'; submitModal(); T('Rejected with a reason', getMS(m.id).status === 'Rejected' && panelText().includes('Signature missing'));
  sample(); click('.panel .panel-foot [data-act="ms-submit"]'); T('resubmitted (submission 2)', getMS(m.id).status === 'Submitted for Approval' && getMS(m.id).submissions.length === 2);
  click('.panel .card [data-act="ms-approve"]'); submitModal(); T('Approved, certificate approved with it', getMS(m.id).status === 'Approved' && docState(getMS(m.id)) === 'Approved');
  T('audit trail records the transitions', db.audit.filter(x => x.text && x.text.includes(m.code)).length >= 5);
  closePanel(); nav('approvals?tab=milestones'); T('approvals queue lists submitted milestones (PO 1052 M2)', mainText().includes('Submitted for Approval') || mainText().includes('M2'));
});

/* ===== 3. MILESTONE FIRST: milestone → create its GRN → invoice (document + accepted GRN) ===== */
run('milestone-first with GRN', () => {
  seedDb('default'); nav('po/po-1045?tab=billing'); const po = PO('po-1045'), m = msOf(po)[2];
  openMilestonePanel(m.id); click('.panel [data-act="ms-start"]'); sample(); click('.panel .panel-foot [data-act="ms-submit"]'); click('.panel .card [data-act="ms-approve"]'); submitModal();
  T('approved, but invoicing blocked until a real GRN is accepted', getMS(m.id).status === 'Approved' && msBilling(getMS(m.id), po) === 'Not Eligible' && panelText().includes('Invoicing stays blocked'));
  T('milestone offers Create GRN / Link GRN right here', panelText().includes('Create GRN for M3') && panelText().includes('Link existing GRN'));
  click('.panel [data-act="grn-new"]'); T('GRN drawer opens for this milestone', ui.f.poId === po.id && ui.f.milestoneId === m.id);
  setv('rows.' + po.lines[0].id + '.received', 1); click('[data-act="grn-save"][data-m="inspect"]');
  const g = db.grns.find(x => x.milestoneId === m.id); T('GRN created and linked to M3, pending inspection', !!g && g.status === 'Pending Inspection' && getMS(m.id).grnIds.includes(g.id));
  T('still blocked while inspection is pending', msBilling(getMS(m.id), po) === 'Not Eligible');
  closePanel(); openReceiptPanel('grn', g.id); click('[data-act="grn-accept"]'); submitModal(); T('GRN accepted', getGRN(g.id).status === 'Accepted');
  T('milestone is now invoiceable', msBilling(getMS(m.id), po) === 'Eligible'); closePanel(); nav('po/po-1045?tab=billing');
  click(`#main [data-act="inv-new"][data-ms="${m.id}"]`); setv('number', 'SITE-1'); click('[data-act="inv-save"][data-m="submit"]');
  T('milestone invoiced for 20,000', db.invoices.some(i => i.number === 'SITE-1' && i.net === 20000)); closePanel();
});

/* ===== 4. PARTIAL invoicing: 50,000 milestone billed in parts, never above the remaining balance ===== */
run('partial invoicing', () => {
  seedDb('default'); const po = PO('po-1045'), m = msOf(po)[0], gb = db.grns.find(g => g.poId === po.id && g.status === 'Pending Inspection');
  T('blocked while a linked GRN is pending', msBilling(m, po) === 'Not Eligible'); openReceiptPanel('grn', gb.id); click('[data-act="grn-accept"]'); submitModal(); closePanel();
  T('eligible once every linked GRN is accepted', msBilling(getMS(m.id), po) === 'Eligible');
  openInvPanel({ poId: po.id, msId: m.id }); setv('number', 'PART-1'); setv(`alloc.milestone:${m.id}.value`, 20000); click('[data-act="inv-save"][data-m="submit"]');
  T('first part (20,000) invoiced', db.invoices.some(i => i.number === 'PART-1' && i.net === 20000)); T('milestone shows Partially Invoiced, 30,000 remaining', msBilling(getMS(m.id), po) === 'Partially Invoiced' && usage('milestone', m.id).value === 20000); closePanel();
  openInvPanel({ poId: po.id, msId: m.id }); setv('number', 'PART-2'); setv(`alloc.milestone:${m.id}.value`, 40000); click('[data-act="inv-save"][data-m="submit"]');
  T('over the remaining balance is blocked', !db.invoices.some(i => i.number === 'PART-2' && i.status !== 'Draft' && i.status !== 'Matching Failed') || !db.invoices.some(i => i.number === 'PART-2' && i.status === 'Pending Approval')); document.querySelector('.overlay')?.remove(); closePanel();
  openInvPanel({ poId: po.id, msId: m.id }); setv('number', 'PART-3'); setv(`alloc.milestone:${m.id}.value`, 30000); click('[data-act="inv-save"][data-m="submit"]');
  T('the exact remaining 30,000 is accepted', db.invoices.some(i => i.number === 'PART-3' && i.status === 'Pending Approval') && msBilling(getMS(m.id), po) === 'Invoiced'); closePanel();
  const p1 = db.invoices.find(i => i.number === 'PART-1'); A.cancelInvoice ? A.cancelInvoice(p1.id, 'test') : null;
  T('cancelling an invoice releases its reservation', usage('milestone', m.id).value === 30000, usage('milestone', m.id).value);
});

/* ===== 5. MIXED PO: GRN for goods lines, SRN for service lines ===== */
run('mixed PO', () => {
  seedDb('default'); nav('po/po-1046?tab=receipts'); const po = PO('po-1046');
  T('mixed PO offers both Create GRN and Create SRN', mainText().includes('Create GRN') && mainText().includes('Create SRN'));
  openGrnPanel(po.id); T('GRN drawer lists the goods line only', document.querySelectorAll('.panel [data-f^="rows."]').length >= 1 && !panelText().includes('Installation & piping')); closePanel();
  openSrnPanel(po.id); T('SRN drawer defaults to the service line', ui.f.lineId === po.lines[1].id); closePanel();
});

/* ===== 6. Services PO from scratch: amount ↔ percentage in the milestone dialog ===== */
run('milestone amount option', () => {
  seedDb('default'); nav('pos'); click('[data-act="po-new"]');
  setv('type', 'Services'); setv('supplierId', 'sup2'); setv('title', 'Annual maintenance'); click('.panel [data-act="ln-add"]'); setv('lines.0.desc', 'Maintenance contract'); setv('lines.0.qty', 1); setv('lines.0.price', 200000);
  click('[data-act="po-method"][data-m="Milestone"]'); T('example schedule loaded', ui.f.milestones.length === 3);
  click('.panel [data-act="ms-edit"][data-i="2"]'); const f = $q('.overlay form'), ai = f.querySelector('[name=amount]'), pi = f.querySelector('[name=pct]');
  T('dialog has an Amount field next to the percentage', !!ai && !!pi && +ai.value === 60000);
  ai.value = 80000; ai.dispatchEvent(new Event('input', { bubbles: true })); T('typing an amount fills the percentage', +pi.value === 40, pi.value);
  pi.value = 30; pi.dispatchEvent(new Event('input', { bubbles: true })); T('typing a percentage fills the amount', +ai.value === 60000, ai.value);
  ai.value = 80000; ai.dispatchEvent(new Event('input', { bubbles: true })); submitModal(); T('amount saved as 40%', ui.f.milestones[2].pct === 40);
  T('invalid schedule is flagged live', $q('#ms-sum').textContent.includes('110%'), $q('#ms-sum').textContent);
  click('[data-act="po-submit"]'); T('invalid schedule blocks the PO', !db.pos.some(p => p.title === 'Annual maintenance')); document.querySelector('.overlay')?.remove();
  click('.panel [data-act="ms-edit"][data-i="2"]'); const f2 = $q('.overlay form'); f2.querySelector('[name=amount]').value = 60000; f2.querySelector('[name=amount]').dispatchEvent(new Event('input', { bubbles: true })); submitModal(); click('[data-act="po-submit"]');
  const po = db.pos.find(p => p.title === 'Annual maintenance'); T('PO created', po && po.status === 'Pending Approval'); T('amounts add up exactly', msOf(po).reduce((s, x) => s + x.amount, 0) === 200000, msOf(po).map(x => x.amount));
  nav('po/' + po.id); ACT['po-approve']({ dataset: { id: po.id } }); submitModal(); T('approved; milestones start Pending', po.status === 'Approved' && msOf(po).every(x => x.status === 'Pending'));
  nav('po/' + po.id + '?tab=receipts'); T('services PO offers Create SRN, never Create GRN', mainText().includes('Create SRN') && !mainText().includes('Create GRN'));
});

/* ===== 3. Progressive receipt-based billing through the invoice drawer ===== */
run('progressive flow', () => {
  seedDb('default'); nav('po/po-1042?tab=billing');
  const g1 = db.grns.find(g => g.poId === 'po-1042' && g.number === 'GRN-001'), g2 = db.grns.find(g => g.poId === 'po-1042' && g.number === 'GRN-002');
  const addLine = id => { click('.panel [data-act="inv-line-add"]'); const cb = $q(`.overlay input[data-pick="${id}"]`); if (!cb) { const none = $q('.overlay')?.textContent.includes('No Items found'); document.querySelector('.overlay')?.remove(); return none ? 'none' : 'missing'; } cb.click(); submitModal(); return 'added'; };
  const inv = (no, g, qty) => { openInvPanel({ poId: 'po-1042' }); ui.f.alloc = {}; render(); setv('number', no); addLine('grn:' + g.id); setv(`alloc.grn:${g.id}.qty`, qty); };
  inv('BIE-001', g1, 30); T('preview + totals update', panelText().includes('35,400'), panelText().slice(0, 100)); click('[data-act="inv-save"][data-m="submit"]');
  T('invoice 1 pending approval', db.invoices.some(i => i.number === 'BIE-001' && i.status === 'Pending Approval' && i.gross === 35400));
  closePanel(); inv('BIE-002', g2, 20); click('[data-act="inv-save"][data-m="submit"]'); T('invoice 2 created', db.invoices.some(i => i.number === 'BIE-002'));
  closePanel(); openInvPanel({ poId: 'po-1042' }); T('fully used GRN-001 is not offered in the Add Line Item dialog', addLine('grn:' + g1.id) !== 'added');
  closePanel(); db.invoices.find(i => i.number === 'BIE-002').status = 'Rejected'; db.invoices.find(i => i.number === 'BIE-002').allocs = [];
  openInvPanel({ poId: 'po-1042' }); T('opening the drawer from a PO fetches every billable line (GRN-002 + GRN-003)', Object.keys(ui.f.alloc).length >= 2 && !!$q('.panel [data-f="alloc.grn:' + g2.id + '.qty"]'), Object.keys(ui.f.alloc));
  openInvPanel({ poId: 'po-1044' }); T('Standard PO fetches the available balance into the line', +ui.f.net > 0, ui.f.net);
  /* over-allocation live message */
  closePanel(); db.invoices.find(i => i.number === 'BIE-002').status = 'Rejected'; db.invoices.find(i => i.number === 'BIE-002').allocs = [];
  openInvPanel({ poId: 'po-1042' }); ui.f.alloc = {}; render(); setv('number', 'Y'); addLine('grn:' + g2.id); setv(`alloc.grn:${g2.id}.qty`, 45);
  T('over-quantity shows a live blocked message', $q('#inv-sum').textContent.includes('would be blocked') && $q('#inv-sum').textContent.includes('exceeds the eligible quantity'), $q('#inv-sum').textContent);
  click('[data-act="inv-save"][data-m="submit"]'); T('over-quantity submit blocked', !db.invoices.some(i => i.number === 'Y') && modalText().length > 0); document.querySelector('.overlay')?.remove(); closePanel();
});

/* ===== 4. Receipts + approvals + AP pages work ===== */
run('queues', () => {
  seedDb('default'); nav('approvals?tab=receipts'); T('approvals lists pending receipts', mainText().includes('GRN-001') || mainText().includes('SRN-002'));
  const i = db.invoices.find(x => x.status === 'Pending Approval'); nav('invoice/' + i.id); ACT['inv-approve']({ dataset: { id: i.id } }); submitModal(); T('invoice approved from detail page', getInv(i.id).status === 'Approved');
  nav('ap'); ACT['inv-post']({ dataset: { id: i.id } }); submitModal(); T('posted from AP', getInv(i.id).status === 'Posted'); ACT['inv-pay']({ dataset: { id: i.id } }); submitModal(); T('paid from AP', getInv(i.id).status === 'Paid');
  nav('receipts'); T('receipts list shows GRN and SRN', mainText().includes('GRN-') && mainText().includes('SRN-'));
});
/* ===== 7. Corrections and edge cases through the UI (PRD §5) ===== */
run('corrections and edge cases', () => {
  seedDb('default'); const po = PO('po-1052'), m = msOf(po)[1];
  nav('approvals?tab=milestones'); T('E13 approvals queue shows ageing (reminder / escalated)', mainText().includes('Reminder sent') && mainText().includes('Escalated to Procurement Manager'));
  openMilestonePanel(m.id); T('milestone drawer offers Request info next to Reject', !!$q('.panel [data-act="ms-info"]'));
  click('.panel .card [data-act="ms-info"]'); $q('.overlay textarea').value = 'page 3 missing'; submitModal();
  T('Request info returns it to the supplier (resubmit allowed)', getMS(m.id).status === 'Rejected' && getMS(m.id).infoRequested === true && panelText().includes('Information requested')); closePanel();
  const i = db.invoices.find(v => v.status === 'Pending Approval'); A.approveInvoice(i.id); A.postInvoice(i.id); nav('invoice/' + i.id);
  click('[data-act="inv-more"]'); const rv = [...document.querySelectorAll('.menu button')].find(b => /Reverse via credit note/.test(b.textContent)); T('posted invoice offers Reverse via credit note', !!rv);
  rv.click(); $q('.overlay textarea').value = 'duplicate billing'; submitModal(); T('invoice reversed; allocation released; banner shows it', getInv(i.id).reversed && mainText().includes('Reversed via credit note') && isLive(getInv(i.id)) === false);
  const x = db.srns.find(r => r.status === 'Accepted'); openReceiptPanel('srn', x.id); T('accepted SRN offers Reverse SRN', !!$q('.panel [data-act="srn-reverse"]'));
  click('.panel [data-act="srn-reverse"]'); $q('.overlay textarea').value = 'not rendered'; submitModal(); T('SRN reversed from its drawer', getSRN(x.id).reversed === true); closePanel();
  const po45 = PO('po-1045'); ACT['po-amend']({ dataset: { id: po45.id } });
  T('amend dialog offers Cancel only on milestones that can still be cancelled', document.querySelectorAll('.overlay input[name^="mx_"]').length >= 1 && document.querySelectorAll('.overlay input[name^="mx_"]').length < msOf(po45).length); document.querySelector('.overlay')?.remove();
});

/* ===== 8. Line-scoped schedule, advance, recovery — end to end through the UI ===== */
run('scoped schedule + advance + recovery (UI)', () => {
  seedDb('default'); nav('pos'); click('[data-act="po-new"]');
  setv('type', 'Goods'); setv('supplierId', 'sup1'); setv('title', 'Scoped PO');
  click('.panel [data-act="ln-add"]'); setv('lines.0.desc', 'Servers'); setv('lines.0.qty', 10); setv('lines.0.price', 1000);
  click('.panel [data-act="ln-add"]'); setv('lines.1.desc', 'Cables'); setv('lines.1.qty', 100); setv('lines.1.price', 10);
  click('[data-act="po-method"][data-m="Milestone"]'); ui.f.milestones = []; render();
  T('line table offers the "Outside" flag for Milestone POs', !!$q('.panel [data-f="lines.0.outside"]'));
  click('.panel [data-act="ms-add"]'); let f = $q('.overlay form');
  T('milestone editor offers scope, gates, advance and dependencies (no document / guarantee options)', !!f.querySelector('[data-mode="lines"]') && !!f.querySelector('[name=requireCompleteQty]') && !f.querySelector('[name=needsGuarantee]') && !f.querySelector('[name=needsDoc]') && !!f.querySelector('[name=advAllowed]'));
  f.querySelector('[name=name]').value = 'Servers delivered'; f.querySelector('[data-mode="lines"]').click();
  const v1 = f.querySelector('#sc-rows [data-k="v"]'); v1.value = 10; v1.dispatchEvent(new Event('input', { bubbles: true }));
  T('editor shows the derived milestone amount', f.querySelector('#sc-total').textContent.includes('10,000'), f.querySelector('#sc-total').textContent);
  f.querySelector('[name=allowPartial]').checked = true; const aa = f.querySelector('[name=advAllowed]'); aa.checked = true; aa.dispatchEvent(new Event('change', { bubbles: true }));
  f.querySelector('[name=advValue]').value = 20; submitModal();
  T('milestone 1 saved with a quantity scope and advance terms', ui.f.milestones.length === 1 && ui.f.milestones[0].scope[0].basis === 'quantity' && ui.f.milestones[0].advance.allowed && ui.f.milestones[0].allowPartial);
  click('.panel [data-act="ms-add"]'); f = $q('.overlay form'); f.querySelector('[name=name]').value = 'Cabling'; f.querySelector('[data-mode="lines"]').click();
  const ls = f.querySelector('#sc-rows [data-k="lineId"]'); ls.value = ui.f.lines[1].id; ls.dispatchEvent(new Event('change', { bubbles: true }));
  const bs = f.querySelector('#sc-rows [data-k="basis"]'); bs.value = 'percent'; bs.dispatchEvent(new Event('change', { bubbles: true }));
  const v2 = f.querySelector('#sc-rows [data-k="v"]'); v2.value = 100; v2.dispatchEvent(new Event('input', { bubbles: true })); submitModal();
  T('coverage panel shows both lines fully assigned', panelText().includes('Fully assigned') && !panelText().includes('Not assigned'), panelText().slice(panelText().indexOf('Coverage'), panelText().indexOf('Coverage') + 200));
  click('[data-act="po-submit"]');
  const po = db.pos.find(p => p.title === 'Scoped PO'); T('PO created with derived amounts 10,000 and 1,000', po && msOf(po).map(m => m.amount).join() === '10000,1000', po && msOf(po).map(m => m.amount));
  ACT['po-approve']({ dataset: { id: po.id } }); submitModal(); T('PO approved', po.status === 'Approved');
  const [m1] = msOf(po);
  nav('po/' + po.id + '?tab=advances'); T('Advances tab shows the terms and the + button', mainText().includes('Advances Requests') || mainText().includes('No Advances'));
  click('#main [data-act="adv-new"]'); f = $q('.overlay form');
  T('Create Advance dialog is prefilled with the agreed advance (20% of 10,000 = 2,000)', +f.querySelector('[name=base]').value === 2000 && $q('.overlay').textContent.includes('Total payable'), f.querySelector('[name=base]').value);
  submitModal(); const adv = db.advances.find(a => a.poId === po.id); T('advance requested', !!adv && adv.base === 2000 && advStatus(adv) === 'Requested');
  ACT['adv-approve']({ dataset: { id: adv.id } }); submitModal(); T('advance approved → ready to invoice', advStatus(getAdv(adv.id)) === 'Approved');
